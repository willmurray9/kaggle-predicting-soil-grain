name: test

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and run tests
        run: |
          python -m pip install -e ".[dev]"
          PYTHONPATH=src python -m pytest -q

  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU vision packages and run encoder tests
        run: |
          python -m pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,vision]"
          PYTHONPATH=src python -m pytest -q tests/test_frozen_features.py tests/test_frozen_experiment.py
